name = "flatcoin-isp"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "flatcoin-isp"
database_id = "552f8718-382e-4a40-b535-1a3dcf49dd83"
migrations_dir = "src/migrations"

[vars]
AZAMPAY_ENV = "sandbox"

# Secrets to set via `wrangler secret put`:
#   AUTH_SECRET            (≥32 bytes)
#   PORTAL_ORIGIN          (e.g. https://portal.example.com)
#   ADMIN_SECRET           (≥32 bytes)
#   RADIUS_SHARED_SECRET   (≥32 bytes)
#   AZAMPAY_APP_NAME
#   AZAMPAY_CLIENT_ID
#   AZAMPAY_CLIENT_SECRET
#   AZAMPAY_WEBHOOK_SECRET
#   MIKROTIK_BASE_URL      (optional)
#   MIKROTIK_USER          (optional)
#   MIKROTIK_PASSWORD      (optional)
